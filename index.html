<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f6feb" />
  <meta name="description" content="تعلّم السياقة في الجزائر وفق قانون المرور: دروس، اختبارات، ومحاكي امتحان، وتعمل دون إنترنت." />
  <title>تعليم السياقة في الجزائر</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">تعليم السياقة في الجزائر</a>
    <nav id="nav" class="nav" aria-label="التنقل الرئيسي"></nav>
    <button id="install-btn" class="install-btn" hidden>تنزيل التطبيق</button>
  </header>

  <div id="ios-hint" class="notice" hidden>
    لتثبيت التطبيق على iPhone: اضغط زر المشاركة
    <span aria-hidden="true">⎋</span>
    ثم اختر «إضافة إلى الشاشة الرئيسية».
  </div>

  <main id="app">
    <p class="loading">جارٍ التحميل…</p>
  </main>

  <footer class="disclaimer">
    المعلومات للتوعية والتعليم فقط وليست بديلاً عن النص الرسمي المنشور في الجريدة الرسمية.
  </footer>

  <script>
    // Classic script: runs even when ES modules are blocked (file:// opens).
    if (location.protocol === 'file:') {
      document.getElementById('app').innerHTML =
        '<h2>افتح التطبيق من رابط إنترنت</h2>' +
        '<p>هذا الملف لا يعمل إذا فُتح مباشرة من الجهاز. افتح الرابط الذي نُشر فيه التطبيق من المتصفح.</p>';
    }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
